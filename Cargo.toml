[package]
name = "sd-jwt-rs"
version = "0.7.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Rust reference implementation of the IETF SD-JWT specification (v7)."
rust-version = "1.88.0"
authors = ["Abdulbois Tursunov <abdulbois.tursunov@dsr-corporation.com>, Sergey Minaev <sergey.minaev@dsr-corporation.com>"]
repository = "https://github.com/openwallet-foundation-labs/sd-jwt-rust"
documentation = "https://docs.rs/sd-jwt-rs"
homepage = "https://github.com/openwallet-foundation-labs/sd-jwt-rust"

[features]
mock_salts = ["lazy_static"]
parallel = []
# Criterion is compiled as a separate crate and cannot reach the private
# issuance executor. This opt-in feature exposes only the deterministic
# benchmark fixture; ordinary builds, including `parallel`-only builds, do not
# compile the fixture or alter production routing.
issuance_bench = ["parallel", "dep:libc", "dep:winapi-util"]

[dependencies]
base64 = "0.21"
hmac = "0.12"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
lazy_static = {  version = "1.4", optional = true }
log = "0.4"
rand = "0.8"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = { version = "1.0.113", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1.0.51"
strum = { version = "0.25", default-features = false, features = ["std", "derive"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `rand` 0.8 delegates browser entropy to `getrandom` 0.2. Let that
# dependency own the JS bindings so its wasm-bindgen family can unify with the
# embedding application instead of forcing one exact transitive release.
getrandom = { version = "0.2", features = ["js"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
# Resolver/compile regression for the JS binding family used by maintained
# consumers. Dev-dependencies do not constrain downstream applications.
wasm-bindgen-futures = "=0.4.76"

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
winapi-util = { version = "0.1.6", optional = true }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false }
rstest = "0.18.2"
regex = "1.10"

[[bench]]
name = "sd_jwt_verification"
harness = false

[[bench]]
name = "sd_jwt_issuance"
harness = false
required-features = ["issuance_bench"]

[[bench]]
name = "sd_jwt_production_rng"
harness = false

[[test]]
name = "issuance_launch_barrier_fixed_binary"
required-features = ["issuance_bench"]

[[example]]
name = "issuance_qualification_manifest"
required-features = ["issuance_bench"]
